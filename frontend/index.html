<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14131a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Приватный общий календарь и поиск свободного времени с друзьями."
    />
    <title>TimeTogether</title>
  </head>
  <body>
    <script>
      const savedTheme = localStorage.getItem('timetogether-theme')
      document.documentElement.dataset.theme =
        savedTheme === 'light' || savedTheme === 'contrast' ? savedTheme : 'dark'
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
